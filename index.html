<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatSphere | Multi-Client Chat</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💬</text></svg>">
</head>
<body>
  <!-- Login Screen -->
  <div id="login-screen" class="screen active">
    <div class="login-card">
      <div class="logo">💬</div>
      <h1>ChatSphere</h1>
      <p class="tagline">Real-time group & private messaging</p>
      <div class="input-group">
        <input type="text" id="username" placeholder="Choose a username" maxlength="24" autocomplete="off" />
        <button id="btnConnect" class="btn-primary">Join Chat</button>
      </div>
      <p class="hint">
        <strong>Tip:</strong> Use <code>@username</code> to send private messages
      </p>
    </div>
  </div>

  <!-- Chat Screen -->
  <div id="chat-screen" class="screen">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h3>Online Users</h3>
        <button id="themeToggle" class="theme-toggle" title="Toggle dark mode">🌙</button>
      </div>
      <ul id="userList" class="user-list"></ul>
    </aside>

    <!-- Main Chat -->
    <main class="main">
      <header class="chat-header">
        <div class="room-info">
          <h2 id="roomTitle">General Chat</h2>
          <span id="userCount" class="user-count">0 online</span>
        </div>
        <div id="connectionStatus" class="status online">Connected</div>
      </header>

      <section id="messages" class="messages"></section>

      <div id="typingIndicator" class="typing-indicator hidden">
        <span></span><span></span><span></span>
        <span class="typing-text">Someone is typing...</span>
      </div>

      <footer class="composer">
        <input
          type="text"
          id="msgInput"
          placeholder="Type a message... (Enter to send, Shift+Enter for new line)"
          autocomplete="off"
        />
        <button id="sendBtn" class="btn-send" title="Send message">Send</button>
      </footer>
    </main>
  </div>

  <script src="ws_client.js"></script>
</body>
</html>
